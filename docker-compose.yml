services:
  mongodb:
    image: mongo:7
    container_name: psms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - psms_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psms-backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Admin}
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - psms_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: psms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - psms_net

volumes:
  mongodb_data:

networks:
  psms_net:
    driver: bridge

